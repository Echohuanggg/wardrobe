<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的衣橱</title>
<style>
  :root{
    --bg:#f4f7fc; --card:#ffffff; --text:#26303e; --sub:#7d8a9c;
    --line:#dce5f1; --accent:#3b82f6; --accent-dark:#1e56c8;
    --spring:#7fb069; --summer:#e9a23b; --autumn:#c96f4a; --winter:#4a7fb8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding-bottom:60px;}
  header{background:linear-gradient(135deg,#4a90f0,#1e56c8); color:#fff; padding:26px 20px 18px; text-align:center;}
  header h1{font-size:24px; letter-spacing:2px;}
  header p{font-size:13px; opacity:.85; margin-top:6px;}
  .container{max-width:1180px; margin:0 auto; padding:16px;}

  /* 统计看板 */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center;}
  .stat .num{font-size:24px; font-weight:700; color:var(--accent-dark);}
  .stat .label{font-size:12px; color:var(--sub); margin-top:2px;}

  /* 筛选栏 */
  .filters{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:16px;}
  .filter-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .filter-row .ft{font-size:13px; color:var(--sub); margin-right:4px;}
  .chip{border:1px solid var(--line); background:#f3f7fd; color:var(--text); border-radius:999px; padding:5px 14px; font-size:13px; cursor:pointer; transition:.15s;}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .chip:hover{border-color:var(--accent);}

  /* 穿搭推荐 */
  .recommend{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; border-left:5px solid var(--accent);}
  .recommend h2{font-size:16px; margin-bottom:10px;}
  .rec-season{display:inline-block; padding:2px 12px; border-radius:999px; color:#fff; font-size:12px; margin-left:8px; vertical-align:middle;}
  .rec-items{display:flex; flex-wrap:wrap; gap:12px; margin:12px 0;}
  .rec-item{background:#f3f7fd; border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:130px; text-align:center;}
  .rec-item .rt{font-size:12px; color:var(--sub);}
  .rec-item .rn{font-size:14px; font-weight:600; margin-top:4px;}
  .rec-reason{font-size:13px; color:var(--sub); line-height:1.6;}
  .btn{background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 18px; font-size:13px; cursor:pointer;}
  .btn:hover{background:var(--accent-dark);}
  .btn.ghost{background:transparent; color:var(--accent-dark); border:1px solid var(--accent);}

  /* 推荐视图切换 */
  .rec-viewbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px;}
  .rec-viewbar .vt{font-size:13px; color:var(--sub); margin-right:4px;}
  .rec-view{display:none;}
  .rec-view.active{display:block;}

  /* 视图A 上下堆叠 */
  .stack{display:flex; flex-direction:column; align-items:center; gap:10px; margin:14px 0;}
  .stack-item{display:flex; align-items:center; gap:12px; background:#f3f7fd; border:1px solid var(--line); border-radius:12px; padding:8px 14px 8px 8px; width:100%; max-width:340px;}
  .stack-img{width:64px; height:64px; border-radius:12px; overflow:hidden; background:#e9f0fa; border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.1); flex:none; cursor:zoom-in;}
  .stack-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .stack-img .ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:26px; color:#a9b7cc;}
  .stack-meta{min-width:0;}
  .stack-cat{display:inline-block; background:var(--accent); color:#fff; font-size:11px; border-radius:999px; padding:1px 10px; margin-bottom:3px;}
  .stack-name{font-size:14px; font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  /* 视图B 假人穿搭 */
  .dummy-wrap{position:relative; width:210px; margin:10px auto 6px; aspect-ratio:200/320;}
  .dummy-body{position:absolute; inset:0; width:100%; height:100%;}
  .dummy-slot{position:absolute; overflow:hidden; background:#fff; border:2.5px solid #fff; box-shadow:0 2px 10px rgba(0,0,0,.18); cursor:zoom-in; display:flex; align-items:center; justify-content:center;}
  .dummy-slot img{width:100%; height:100%; object-fit:cover; display:block;}
  .dummy-slot .ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:30px; color:#c9c3b6; background:#f0ede6;}
  .dummy-hat{top:-4%; left:50%; transform:translateX(-50%); width:34%; aspect-ratio:1; border-radius:50%;}
  .dummy-top{top:15%; left:50%; transform:translateX(-50%); width:46%; aspect-ratio:1; border-radius:50%; z-index:2;}
  .dummy-outer{top:12%; left:50%; transform:translateX(-50%); width:54%; aspect-ratio:1; border-radius:22%; z-index:3; opacity:.96;}
  .dummy-bottom{top:46%; left:50%; transform:translateX(-50%); width:44%; aspect-ratio:1.15; border-radius:46%; z-index:1;}
  .dummy-list{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:8px 0 2px;}
  .dummy-tag{font-size:12px; background:#edf3fb; border:1px solid var(--line); border-radius:999px; padding:2px 10px; color:var(--text);}

  /* 图片放大 */
  .lightbox{position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; z-index:200; cursor:zoom-out;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:86vw; max-height:84vh; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,.4); background:#fff;}

  /* 卡片墙 */
  .section{margin-bottom:20px;}
  .section-title{font-size:17px; font-weight:700; margin:18px 0 10px; display:flex; align-items:center; gap:8px;}
  .section-title .cnt{font-size:12px; color:var(--sub); font-weight:400;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; transition:transform .12s, box-shadow .12s;}
  .card:hover{transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.08);}
  .card img{width:100%; height:140px; object-fit:cover; background:#e9f0fa; display:block;}
  .card.noimg{height:140px; background:#e9f0fa; display:flex; align-items:center; justify-content:center; color:#a9b7cc; font-size:28px;}
  .card .info{padding:8px 10px 10px;}
  .card .name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .color{font-size:12px; color:var(--sub); margin-top:2px;}
  .card .tags{margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;}
  .tag{font-size:11px; padding:1px 8px; border-radius:999px; background:#edf3fb; color:var(--text);}
  .tag.s-春{background:#e5f0df; color:#4a7d3a;}
  .tag.s-夏{background:#fdf0d5; color:#a86f14;}
  .tag.s-秋{background:#f7e3da; color:#a34f2c;}
  .tag.s-冬{background:#e1e9f2; color:#3e6185;}

  /* 穿搭样板 */
  .outfit-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:16px;}
  .outfit-card{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; transition:transform .12s, box-shadow .12s;}
  .outfit-card:hover{transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.08);}
  .outfit-imgwrap{position:relative; aspect-ratio:3/4; cursor:zoom-in; background:#e9f0fa; overflow:hidden;}
  .outfit-imgwrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .outfit-badge{position:absolute; top:10px; left:10px; background:rgba(0,0,0,.55); color:#fff; font-size:12px; border-radius:999px; padding:3px 12px;}
  .outfit-info{padding:12px 14px 14px;}
  .outfit-title{font-size:15px; font-weight:700; line-height:1.4;}
  .outfit-tags{margin-top:6px; display:flex; flex-wrap:wrap; gap:5px;}
  .outfit-tag{font-size:11px; padding:2px 10px; border-radius:999px; background:#edf3fb; color:var(--text);}
  .outfit-tag.cat-慧穿搭{background:#f7e3da; color:#a34f2c;}
  .outfit-tag.cat-种草图{background:#e5f0df; color:#4a7d3a;}
  .outfit-tag.outfit-season{background:#fdf0d5; color:#a86f14;}
  .outfit-note{font-size:12px; color:var(--sub); margin-top:8px; line-height:1.55;}

  /* 表单 */
  .form-wrap{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:24px;}
  .form-wrap h2{font-size:16px; margin-bottom:12px;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px;}
  .form-grid label{display:block; font-size:12px; color:var(--sub); margin-bottom:4px;}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; background:#fff;}
  .form-grid textarea{grid-column:1/-1; resize:vertical; min-height:52px;}
  .form-actions{margin-top:12px; display:flex; gap:10px; align-items:center;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 22px; border-radius:999px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:99;}
  .toast.show{opacity:1;}
  .empty{text-align:center; color:var(--sub); padding:40px 0; font-size:14px;}

  /* 天气条 */
  .weatherbar{background:linear-gradient(135deg,#eaf1fe,#f8fbff); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;}
  .wb-info{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; min-width:0;}
  .wb-city{font-size:15px; font-weight:700; color:var(--accent-dark);}
  .wb-city::after{content:"·"; color:var(--line); margin-left:10px; font-weight:400;}
  .wb-temp{font-size:22px; font-weight:800; color:var(--text); line-height:1;}
  .wb-text{font-size:13px; color:var(--sub);}
  .wb-time{font-size:12px; color:#a9b7cc;}
  .wb-rain{font-size:12px; color:#9a5b00; background:#fdf0d5; border-radius:999px; padding:2px 10px; font-weight:600;}
  .wb-ctl{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .wb-ctl select,.wb-ctl input{border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:13px; font-family:inherit; background:#fff; color:var(--text);}
  .wb-ctl input{width:148px;}
  .btn.small{padding:5px 12px; font-size:12px; border-radius:8px;}

  /* 今日天气推荐（墙顶置顶区） */
  .today-card-hl{border:1.5px solid var(--accent);}
  .today-tag{display:inline-block; background:var(--accent); color:#fff; font-size:10px; line-height:1; padding:2px 6px; border-radius:4px; margin-left:6px; vertical-align:1px; font-weight:600;}
  .today-reason{font-size:12px; color:var(--sub); line-height:1.6; background:#f3f7fd; border:1px dashed var(--line); border-radius:10px; padding:8px 12px; margin:0 0 12px;}
  @media (max-width:640px){
    .stats{grid-template-columns:repeat(4,1fr);}
    .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
    .card img{height:110px;}
    .card.noimg{height:110px;}
  }
</style>
</head>
<body>
<header>
  <h1>我的衣橱</h1>
  <p id="todayLine"></p>
</header>
<div class="container">

  <!-- 天气条 -->
  <div class="weatherbar" id="weatherBar">
    <div class="wb-info">
      <span class="wb-city" id="wbCity">--</span>
      <span class="wb-temp" id="wbTemp">--</span>
      <span class="wb-text" id="wbText">天气加载中…</span>
      <span class="wb-rain" id="wbRain" style="display:none;"></span>
      <span class="wb-time" id="wbTime"></span>
    </div>
    <div class="wb-ctl">
      <select id="citySelect" title="常用城市"></select>
      <input id="cityInput" list="cityList" placeholder="输入城市名查询后回车" title="输入城市名后按回车">
      <datalist id="cityList"></datalist>
      <button class="btn small" id="cityGoBtn" type="button">切换</button>
    </div>
  </div>

  <!-- 统计看板 -->
  <div class="stats" id="stats"></div>

  <!-- 穿搭推荐 -->
  <div class="recommend">
    <h2>今日穿搭推荐 <span class="rec-season" id="recSeasonTag">--</span></h2>
    <div class="rec-viewbar">
      <span class="vt">展示方式</span>
      <button class="chip active" id="viewBtnA" onclick="setView('a')">上下堆叠</button>
      <button class="chip" id="viewBtnB" onclick="setView('b')">假人穿搭</button>
    </div>
    <div class="rec-view active" id="recViewA"></div>
    <div class="rec-view" id="recViewB"></div>
    <div class="rec-reason" id="recReason"></div>
    <div style="margin-top:12px;">
      <button class="btn" onclick="refreshRecommend(true)">换一套</button>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="filters">
    <div class="filter-row" id="catRow" style="margin-bottom:8px;">
      <span class="ft">分类</span>
    </div>
    <div class="filter-row">
      <span class="ft">季节</span>
      <span class="chip active" data-season="全部">全部</span>
      <span class="chip" data-season="春">春</span>
      <span class="chip" data-season="夏">夏</span>
      <span class="chip" data-season="秋">秋</span>
      <span class="chip" data-season="冬">冬</span>
    </div>
    <div class="filter-row" id="brandRow" style="margin-top:8px;">
      <span class="ft">品牌</span>
    </div>
    <div class="filter-row" id="yearRow" style="margin-top:8px;">
      <span class="ft">购买年</span>
    </div>
  </div>

  <!-- 今日天气推荐（墙顶置顶区） -->
  <div id="todayZone"></div>

  <!-- 卡片墙 -->
  <div id="wall"></div>

  <!-- 穿搭样板 -->
  <div class="section" id="outfitSection">
    <div class="section-title">穿搭样板 <span class="cnt" id="outfitCount"></span></div>
    <div class="filters">
      <div class="filter-row">
        <span class="ft">类别</span>
        <span class="chip active" data-outcat="全部">全部</span>
        <span class="chip" data-outcat="慧穿搭">慧穿搭</span>
        <span class="chip" data-outcat="种草图">种草图</span>
      </div>
    </div>
    <div id="outfitWall"></div>
  </div>

  <!-- 录入表单 -->
  <div class="form-wrap">
    <h2>录入新衣物</h2>
    <form id="addForm" onsubmit="submitCloth(event)">
      <div class="form-grid">
        <div><label>名称 *</label><input name="name" required placeholder="如：白色短袖T恤"></div>
        <div><label>类别 *</label>
          <select name="category" required>
            <option value="上衣">上衣</option><option value="卫衣">卫衣</option><option value="外套">外套</option>
            <option value="大衣">大衣</option><option value="裤子">裤子</option><option value="裙子">裙子</option><option value="连衣裙">连衣裙</option>
            <option value="背心">背心</option><option value="帽子">帽子</option>
          </select>
        </div>
        <div><label>颜色</label><input name="color" placeholder="如：白 / 蓝"></div>
        <div><label>材质</label><input name="material" placeholder="如：棉 / 羊毛"></div>
        <div><label>季节（可多选）</label>
          <select name="seasons" multiple size="1" style="height:38px;">
            <option value="春">春</option><option value="夏">夏</option><option value="秋">秋</option><option value="冬">冬</option>
          </select>
        </div>
        <div><label>备注</label><input name="note" placeholder="可选"></div>
        <textarea name="note2" placeholder="详细备注（可选）"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn">保存</button>
        <span style="font-size:12px;color:var(--sub);" id="formMsg"></span>
      </div>
    </form>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
let CATEGORIES = ["帽子","背心","上衣","裤子","裙子","连衣裙","卫衣","外套","大衣"];
const BASE_CAT_ORDER = ["帽子","背心","上衣","裤子","裙子","连衣裙","卫衣","外套","大衣"];
const CAT_ICONS = {帽子:"🎩",背心:"🎽",上衣:"👕",裤子:"👖",裙子:"👗",连衣裙:"👗",卫衣:"🧥",外套:"🧥",大衣:"🧥"};
let WARDROBE = [];
let OUTFITS = [];
let curCat = "全部";
let curSeasons = new Set();
let curBrand = "全部";
let curYear = "全部";
let curOutCat = "全部";

/* ===== 天气功能：城市表（code=中国天气网城市代码，en=wttr.in 城市名） ===== */
const CITY_LIST = [

  {code:"101280601", name:"深圳", en:"Shenzhen"},
  {code:"101280701", name:"珠海", en:"Zhuhai"},
  {code:"101281601", name:"东莞", en:"Dongguan"},
  {code:"101290101", name:"昆明", en:"Kunming"},
  {code:"101300101", name:"南宁", en:"Nanning"},
  {code:"101310101", name:"海口", en:"Haikou"},

];
const DEFAULT_CITY = "101020100"; // 上海
const LS_CITY = "wardrobe_city_code"; // localStorage 记住城市

/* ===== 天气功能：运行时状态 ===== */
let weatherState = { // 天气条展示数据

  city:"上海", cityCode:DEFAULT_CITY,
  temp:null,               // 数字温度（实时），null=未知
  text:"",                 // 天气状况文字
  isRain:false,            // 是否下雨（含雨/雷/雨夹雪）
  source:"",               // weathercn | wttr | month
  time:""                  // 数据时间
};
let weatherSeasons = null; // 今日推荐季节集合，null=尚未确定（先按月份兜底）
let recommendSeasonShown = ""; // 上次"今日穿搭推荐"使用的季节，用于天气就绪后联动刷新

function $(id){return document.getElementById(id);}

function seasonOfMonth(m){
  if(m>=3 && m<=5) return "春";
  if(m>=6 && m<=8) return "夏";
  if(m>=9 && m<=11) return "秋";
  return "冬";
}

/* ===== 天气功能 ===== */

// 温度 → 推荐季节集合：≥26 夏 / 18~25 春秋 / 10~17 春秋偏凉+冬 / <10 冬
function seasonsForTemp(t){
  t = Number(t);
  if(t>=26) return ["夏"];
  if(t>=18) return ["春","秋"];
  if(t>=10) return ["春","秋","冬"];
  return ["冬"];
}

// 今日穿搭推荐的主季节：有实时天气按温度分档；无天气按当前月份
function weatherMainSeason(){
  const m = new Date().getMonth()+1;
  const arr = (weatherSeasons && weatherSeasons.length) ? weatherSeasons : [seasonOfMonth(m)];
  const ms = seasonOfMonth(m);
  return arr.indexOf(ms)>=0 ? ms : arr[0];
}

function cityByCode(code){
  return CITY_LIST.find(c=>c.code===String(code)) || null;
}
function cityByName(name){
  const kw = String(name||"").trim();
  if(!kw) return null;
  return CITY_LIST.find(c=>c.name===kw) || CITY_LIST.find(c=>c.name.indexOf(kw)>=0) || null;
}

// 英文天气描述 → 中文（wttr.in 源用）
function enWeatherZh(desc){
  const rules = [
    [/thundery|thunder|storm/i, "雷阵雨"],
    [/torrential|heavy rain|heavy showers/i, "大雨"],
    [/moderate rain|rain at times|heavy rain at times/i, "中雨"],
    [/light rain|light drizzle|patchy rain|drizzle|light showers|showers/i, "小雨"],
    [/freezing drizzle|sleet|ice pellets/i, "雨夹雪"],
    [/blizzard|snow|snow shower/i, "雪"],
    [/fog|mist|haze/i, "雾"],
    [/overcast/i, "阴"],
    [/partly cloudy|cloudy|cloud/i, "多云"],
    [/clear|sunny/i, "晴"]
  ];
  for(const r of rules){ if(r[0].test(desc)) return r[1]; }
  return desc || "";
}

// 天气条渲染（weatherState 驱动）
function renderWeatherBar(){
  const w = weatherState;
  $("wbCity").textContent = w.city;
  $("wbTemp").textContent = (w.temp!==null && !isNaN(w.temp)) ? Math.round(w.temp)+"°C" : "--";
  $("wbText").textContent = w.text || (w.status==="fail" ? "天气获取失败" : "天气加载中…");
  $("wbTime").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
  const rainEl = $("wbRain");
  if(w.isRain){
    rainEl.style.display = "";
    rainEl.textContent = "☔ 有雨，今日穿搭请防雨";
  }else{
    rainEl.style.display = "none";
  }

// 天气就绪后的统一收尾：刷新置顶推荐区；若推荐季节与当前搭配展示不一致则换一套
function refreshAfterWeather(){
  renderTodayZone();
  if(!WARDROBE.length) return;
  const s = weatherMainSeason();
  if(s && s!==recommendSeasonShown){
    recommendSeasonShown = s;
    renderRecommend(true);
  }
}

// 场景1：天气就绪
function applyWeather(w){
  weatherState.status = "ok";
  weatherState.temp = w.temp;
  weatherState.text = w.text || "";
  weatherState.isRain = !!w.isRain;
  weatherState.city = w.city;
  weatherState.cityCode = w.cityCode;
  weatherState.source = w.source;
  weatherState.time = w.time || "";
  weatherSeasons = seasonsForTemp(w.temp);
  renderWeatherBar();
  refreshAfterWeather();
}

// 场景2：两个接口都失败 → 按月份降级（页面不白屏，天气条给出提示）
function weatherFallbackMonth(city){
  weatherState.status = "fail";
  weatherState.city = city.name;
  weatherState.cityCode = city.code;
  weatherState.temp = null;
  weatherState.text = "";
  weatherState.isRain = false;
  weatherState.source = "month";
  weatherSeasons = null; // 走月份
  renderWeatherBar();
  refreshAfterWeather();
}

// 源A：中国天气网 weather.com.cn（JSONP script 绕过 CORS；接口带 Referer 防盗链，浏览器无法伪造，
// 被拦/失败/缺测时自动切源B wttr.in → 月份兜底）
function weatherFromWcCn(city){
  const proto = location.protocol==="https:" ? "https:" : "http:";
  const url = proto + "//d1.weather.com.cn/weather_index/" + city.code + ".html?callback=wcCb" + Date.now();
  const s = document.createElement("script");
  let done = false;
  const timer = setTimeout(()=>{ finish(); weatherFromWttr(city); }, 6000);
  function finish(){
    if(done) return;
    done = true;
    clearTimeout(timer);
    s.onload = null; s.onerror = null;
    if(s.parentNode) s.parentNode.removeChild(s);
  }
  s.onload = function(){
    finish();
    const sk = window.dataSK;
    if(sk && sk.temp && String(sk.temp)!=="999"){
      applyWeather({
        temp: Number(sk.temp),
        text: sk.weather || ((window.cityDZ && window.cityDZ.weatherinfo) ? window.cityDZ.weatherinfo.weather : ""),
        isRain: String(sk.rain)==="1" || /雨|雷/.test(sk.weather||""),
        city: city.name,
        cityCode: city.code,
        source: "weathercn",
        time: sk.time || ""
      });
    }else{
      weatherFromWttr(city); // 缺测或被防盗链页替换
    }
  };
  s.onerror = function(){ finish(); weatherFromWttr(city); };
  s.src = url;
  document.head.appendChild(s);
}

// 源B：wttr.in（https + CORS 开放，无需 Referer，可作等价可用接口）
function weatherFromWttr(city){
  const url = "https://wttr.in/" + encodeURIComponent(city.en) + "?format=j1&lang=zh";
  fetch(url, {cache:"no-store"})
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(d=>{
      const cc = (d.current_condition||[])[0];
      if(!cc || cc.temp_C===undefined || cc.temp_C===null) throw new Error("no data");
      const desc = (cc.weatherDesc&&cc.weatherDesc[0]&&cc.weatherDesc[0].value)
                || (cc.lang_zh&&cc.lang_zh[0]&&cc.lang_zh[0].value) || "";
      applyWeather({
        temp: Number(cc.temp_C),
        text: enWeatherZh(desc),
        isRain: /rain|drizzle|thunder|shower|sleet/i.test(desc) || Number(cc.precipMM||0)>0.2,
        city: city.name,
        cityCode: city.code,
        source: "wttr",
        time: cc.observation_time || ""
      });
    })
    .catch(()=>{ weatherFallbackMonth(city); });
}

function yearOf(c){
  const pd = (c.purchase_date||"").toString().trim();
  return /^\d{4}/.test(pd) ? pd.slice(0,4) : "";
}

function filteredList(){
  return WARDROBE.filter(c=>{
    if(curCat!=="全部" && c.category!==curCat) return false;
    if(curSeasons.size && !(c.seasons||[]).some(s=>curSeasons.has(s))) return false;
    if(curBrand!=="全部" && (c.brand||"").trim()!==curBrand) return false;
    if(curYear!=="全部"){
      const y = yearOf(c);
      if(curYear==="未知"){ if(y) return false; }

    }
    return true;
  });
}

      html += `<div class="card" title="${c.name}${c.note? "｜"+c.note:""}">${img}<div class="info"><div class="name">${c.name}</div>${color}<div class="tags">${tags}</div></div></div>`;

function getTodayRecommend(force){
  const now = new Date();
  const m = now.getMonth()+1;
  // 有实时天气按温度定季，无天气按当前月份
  const season = weatherMainSeason();
  const candidates = WARDROBE.filter(c=>(c.seasons||[]).includes(season));
  const hats = candidates.filter(c=>c.category==="帽子");
  const tops = candidates.filter(c=>["上衣","卫衣","背心"].includes(c.category));
  const bottoms = candidates.filter(c=>["裤子","裙子"].includes(c.category));
  const outers = candidates.filter(c=>["外套","大衣"].includes(c.category));
  const used = JSON.parse(localStorage.getItem("wardrobe_used")||"[]");

  const pick = (arr, usedIds)=>{
    if(!arr.length) return null;
    const fresh = arr.filter(c=>!usedIds.includes(c.id));
    const pool = fresh.length? fresh : arr;
    return pool[Math.floor(Math.random()*pool.length)];
  };

  const usedNow = used.slice(-24);
  let hat = pick(hats, usedNow);
  let top = pick(tops, usedNow);
  let bottom = pick(bottoms, usedNow);
  let outer = (season!=="夏" && outers.length) ? pick(outers, usedNow) : null;

  // 兜底：若某类为空则从全部季节里补
  if(!hat) hat = hats[Math.floor(Math.random()*hats.length)];
  if(!top) top = tops[Math.floor(Math.random()*tops.length)];
  if(!bottom) bottom = bottoms[Math.floor(Math.random()*bottoms.length)];

  const combo = [hat, top, bottom, outer].filter(Boolean);
  const newUsed = used.concat(combo.map(c=>c.id)).slice(-60);
  localStorage.setItem("wardrobe_used", JSON.stringify(newUsed));
  return {season, hat, top, bottom, outer, combo};
}

function renderRecommend(force){
  const r = getTodayRecommend(force);
  const seasonColor = {春:"var(--spring)",夏:"var(--summer)",秋:"var(--autumn)",冬:"var(--winter)"};
  const tag = $("recSeasonTag");
  tag.textContent = `${r.season}季`;
  tag.style.background = seasonColor[r.season];

  const items = [["帽子",r.hat],["上装",r.top],["下装",r.bottom],["外套",r.outer]];
  const hasAny = items.some(([,it])=>it);
  // 视图A：上下堆叠
  const htmlA = hasAny
    ? `<div class="stack">${items.map(([t,it])=>recStackCard(t,it)).join("")}</div>`
    : `<div class="rec-item"><div class="rn">暂无可用衣物</div></div>`;
  // 视图B：假人穿搭
  const htmlB = hasAny ? recDummyHtml(r) : `<div class="rec-item"><div class="rn">暂无可用衣物</div></div>`;
  $("recViewA").innerHTML = htmlA;
  $("recViewB").innerHTML = htmlB;

  const now = new Date();
  recommendSeasonShown = r.season;
  const reasonParts = [];
  if(weatherState.status==="ok" && weatherState.temp!==null){
    reasonParts.push(`今天${weatherState.city} ${Math.round(weatherState.temp)}°C${weatherState.text? " "+weatherState.text:""}，推荐${r.season}季搭配`);
    if(weatherState.isRain) reasonParts.push(`☔ 有雨，出门记得带伞`);
  }else{
    reasonParts.push(`当前${now.getMonth()+1}月为${r.season}季`);
  }
  if(r.hat) reasonParts.push(`帽子选${r.hat.name}${r.hat.color? "（"+r.hat.color+"）":""}`);
  if(r.top) reasonParts.push(`上装选择${r.top.name}（${r.top.color||"任意色"}）`);
  if(r.bottom) reasonParts.push(`下装搭配${r.bottom.name}`);
  if(r.outer) reasonParts.push(`气温波动大，叠穿${r.outer.name}更稳妥`);
  else if(r.season==="夏") reasonParts.push(`夏季炎热，无需外套`);
  reasonParts.push(`已为你避开最近推荐过的组合`);
  $("recReason").textContent = reasonParts.join("，") + "。";
}

    };
  });
  yearRow.querySelectorAll(".chip[data-year]").forEach(ch=>{
    ch.onclick = ()=>{
      yearRow.querySelectorAll(".chip[data-year]").forEach(x=>x.classList.remove("active"));
      ch.classList.add("active");
      curYear = ch.dataset.year;
      renderWall();
    };
  });
}

function initFilters(){
  document.querySelectorAll(".chip[data-season]").forEach(ch=>{
    ch.onclick = ()=>{
      if(ch.dataset.season==="全部"){
        curSeasons.clear();
        document.querySelectorAll(".chip[data-season]").forEach(x=>x.classList.toggle("active", x===ch));
      }else{
        const s = ch.dataset.season;
        if(curSeasons.has(s)) curSeasons.delete(s); else curSeasons.add(s);
        ch.classList.toggle("active");
        const allChip = document.querySelector('.chip[data-season="全部"]');
        if(allChip) allChip.classList.toggle("active", curSeasons.size===0);
      }
      renderWall();
    };
  });
}

function renderOutfits(){
  const list = OUTFITS.filter(o=> curOutCat==="全部" || o.category===curOutCat);
  $("outfitCount").textContent = `${OUTFITS.length} 套`;
  if(!list.length){
    $("outfitWall").innerHTML = `<div class="empty">${curOutCat==="全部" ? "暂无穿搭样板，可在 Excel「穿搭样板」表中添加" : "该类别下暂无穿搭样板"}</div>`;
    return;
  }
  let html = `<div class="outfit-grid">`;
  list.forEach(o=>{
    const tags = [];
    if(o.category) tags.push(`<span class="outfit-tag cat-${escAttr(o.category)}">${escAttr(o.category)}</span>`);
    if(o.season) tags.push(`<span class="outfit-tag outfit-season">${escAttr(o.season)}</span>`);
    if(o.scene) tags.push(`<span class="outfit-tag">${escAttr(o.scene)}</span>`);
    html += `<div class="outfit-card">` +
      `<div class="outfit-imgwrap" title="点击放大" onclick="openLightbox('${escAttr(o.image)}')">` +
        `<img src="${escAttr(o.image)}" alt="${escAttr(o.title)}" loading="lazy" onerror="this.style.display='none'">` +
        `<span class="outfit-badge">${escAttr(o.category)}</span>` +
      `</div>` +
      `<div class="outfit-info">` +
        `<div class="outfit-title">${escAttr(o.title)}</div>` +
        `<div class="outfit-tags">${tags.join("")}</div>` +
        (o.note? `<div class="outfit-note">${escAttr(o.note)}</div>`:"") +
      `</div>` +
    `</div>`;
  });
  html += `</div>`;
  $("outfitWall").innerHTML = html;
}

function initOutfitFilters(){
  document.querySelectorAll(".chip[data-outcat]").forEach(ch=>{
    ch.onclick = ()=>{
      document.querySelectorAll(".chip[data-outcat]").forEach(x=>x.classList.remove("active"));
      ch.classList.add("active");
      curOutCat = ch.dataset.outcat;
      renderOutfits();
    };
  });
}

async function loadOutfits(){
  try{
    const res = await fetch("outfits.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    OUTFITS = await res.json();
  }catch(err){
    OUTFITS = [];
  }
  renderOutfits();
}

async function submitCloth(e){
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  const category = f.category.value;
  const seasons = Array.from(f.seasons.selectedOptions).map(o=>o.value);
  const note = (f.note.value.trim()+" "+(f.note2.value.trim()||"")).trim();
  const payload = {
    name, category,
    color: f.color.value.trim(),
    material: f.material.value.trim(),
    seasons: seasons.length? seasons : ["春","秋"],
    note
  };
  try{
    const res = await fetch("/api/clothes", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    if(!data.success) throw new Error(data.message||"保存失败");
    f.reset();
    showToast("已保存："+name);
    await loadData();
    renderWall(); renderRecommend(false); loadStats();
  }catch(err){
    showToast("保存失败："+err.message);
  }
}

function showToast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

async function loadData(){
  try{
    const res = await fetch("wardrobe.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    WARDROBE = await res.json();
    buildDynamicFilters();
    $("todayLine").textContent = `共 ${WARDROBE.length} 件衣物 · 数据加载正常 · 更新于 ${new Date().toLocaleDateString("zh-CN")}`;
    loadStats(); renderWall(); renderRecommend(false); renderTodayZone();
  }catch(err){
    $("todayLine").textContent = "数据加载失败："+err.message;
    $("wall").innerHTML = `<div class="empty">无法读取 wardrobe.json，请确认已在衣橱目录启动服务</div>`;
  }
}

initFilters();
initOutfitFilters();
initCityControls();
loadData();
loadOutfits();
loadWeather(); // 天气异步加载：weather.com.cn JSONP → wttr.in → 月份降级，全程不阻塞页面
</script>
</body>
</html>
